services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTO_IMPORT: "true"
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
